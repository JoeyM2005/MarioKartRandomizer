<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MK8DX Randomizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent: #0057B8;
    --accent2: #5ba4ff;
    --dark: #0D0D0D;
    --card: #080c1a;
    --card-border: rgba(0,87,184,0.25);
    --white: #FFFDF5;
    --muted: rgba(255,253,245,0.5);
  }
  body { background: var(--dark); color: var(--white); font-family: 'Nunito', sans-serif; min-height: 100vh; }

  .bg-road {
    position: fixed; inset: 0; z-index: 0;
    background:
      repeating-linear-gradient(90deg, transparent 0, transparent 48px, rgba(255,255,255,0.025) 48px, rgba(255,255,255,0.025) 50px),
      repeating-linear-gradient(180deg, transparent 0, transparent 48px, rgba(255,255,255,0.025) 48px, rgba(255,255,255,0.025) 50px),
      linear-gradient(160deg, #0D0D0D, #05050f, #0D0D0D);
    animation: scroll 8s linear infinite;
  }
  @keyframes scroll { to { background-position: 0 -96px, 0 -96px, 0 0; } }

  .content { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 0 20px 60px; }

  nav { display: flex; align-items: center; padding: 20px 0; gap: 16px; }
  nav a { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 700; letter-spacing: 1px; transition: color 0.2s; }
  nav a:hover { color: var(--white); }
  .nav-sep { color: var(--muted); }

  header { text-align: center; padding: 30px 0 40px; }
  .badge {
    display: inline-block; padding: 4px 14px; border-radius: 100px;
    background: rgba(0,87,184,0.15); border: 1px solid rgba(0,87,184,0.4);
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent2); margin-bottom: 14px;
  }
  h1 {
    font-family: 'Bangers', cursive;
    font-size: clamp(40px, 8vw, 74px); line-height: 0.95; color: var(--white);
    text-shadow: 3px 3px 0 var(--accent), 6px 6px 0 #001a60, 0 0 50px rgba(0,87,184,0.3);
    letter-spacing: 2px; margin-bottom: 12px;
  }

  .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 32px 0; }
  @media (max-width: 540px) { .config-grid { grid-template-columns: 1fr; } }

  .config-block {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 18px 20px;
  }
  .config-block label {
    display: block; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
  }
  select {
    width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; color: var(--white); font-family: 'Nunito', sans-serif;
    font-size: 15px; font-weight: 700; padding: 8px 12px; outline: none; appearance: none;
  }
  select option { background: #080c1a; }
  .range-row { display: flex; align-items: center; gap: 12px; }
  input[type=range] { width: 100%; padding: 0; accent-color: var(--accent2); cursor: pointer; }
  .range-val { font-family: 'Bangers', cursive; font-size: 26px; color: var(--accent2); min-width: 36px; text-align: right; }
  .config-block.full { grid-column: 1 / -1; }

  .toggle-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .toggle-btn, .item-mode-btn {
    flex: 1; min-width: 100px; padding: 9px 6px;
    border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05);
    color: var(--muted); border-radius: 8px; font-family: 'Nunito', sans-serif;
    font-weight: 900; font-size: 13px; cursor: pointer; transition: all 0.15s;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .toggle-btn.active, .item-mode-btn.active {
    background: rgba(0,87,184,0.2); border-color: var(--accent); color: var(--white);
  }
  .item-count-row { margin-top: 12px; }

  .roll-wrap { text-align: center; margin: 28px 0; }
  .roll-btn {
    font-family: 'Bangers', cursive; font-size: 28px; letter-spacing: 3px;
    padding: 16px 54px; border: none; border-radius: 100px;
    background: linear-gradient(135deg, var(--accent), #003a80); color: white; cursor: pointer;
    box-shadow: 0 6px 30px rgba(0,87,184,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: transform 0.15s, box-shadow 0.15s; position: relative; overflow: hidden;
  }
  .roll-btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.12)); }
  .roll-btn:hover { transform: scale(1.04); box-shadow: 0 10px 40px rgba(0,87,184,0.65); }
  .roll-btn:active { transform: scale(0.98); }

  #results { display: none; }
  #results.show { display: block; animation: rise 0.4s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .result-section {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 16px; margin-bottom: 14px; overflow: hidden;
  }
  .result-head {
    display: flex; align-items: center; gap: 10px; padding: 14px 20px;
    background: rgba(0,87,184,0.08); border-bottom: 1px solid var(--card-border);
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent2); font-weight: 900;
  }
  .result-head .icon { font-size: 18px; }
  .result-body { padding: 10px 0; }

  .result-row {
    display: flex; align-items: center; padding: 10px 20px; gap: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.15s;
  }
  .result-row:last-child { border-bottom: none; }
  .result-row:hover { background: rgba(255,255,255,0.03); }
  .result-label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); min-width: 72px; }
  .result-value { font-weight: 900; font-size: 15px; flex: 1; }
  .result-num { font-family: 'Bangers', cursive; font-size: 22px; color: var(--accent2); min-width: 28px; text-align: right; }

  .kart-detail { display: flex; flex-direction: column; flex: 1; gap: 3px; }
  .kart-parts { font-size: 12px; color: var(--muted); font-weight: 700; }
  .course-cup { font-size: 11px; color: var(--accent2); font-weight: 700; opacity: 0.8; }

  .reroll-wrap { text-align: center; margin-top: 20px; }
  .reroll-btn {
    background: transparent; border: 1px solid rgba(0,87,184,0.4); color: var(--accent2);
    font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 14px; letter-spacing: 1px;
    text-transform: uppercase; padding: 10px 28px; border-radius: 100px; cursor: pointer; transition: all 0.2s;
  }
  .reroll-btn:hover { background: rgba(0,87,184,0.12); border-color: var(--accent2); }
</style>
</head>
<body>
<div class="bg-road"></div>
<div class="content">
  <nav>
    <a href="index.html">← Home</a>
    <span class="nav-sep">/</span>
    <span style="color:var(--white);font-weight:900">MK8 Deluxe</span>
  </nav>

  <header>
    <div class="badge">Nintendo Switch</div>
    <img src="MarioKartSprites/MK8DXSprites/logo-mk8.png"
        alt="Mario Kart 8 Deluxe"
        style="max-width: 480px; width: 85%; display: block; margin: 0 auto 12px;">
    <p style="color:var(--muted);font-size:15px;margin-top:8px">Click "Roll Everything" and have fun racing!</p>
  </header>

  <div class="config-grid">
    <div class="config-block">
      <label>Players</label>
      <div class="range-row">
        <input type="range" id="players" min="1" max="4" value="2" oninput="syncRange('players','pval')">
        <span class="range-val" id="pval">2</span>
      </div>
    </div>

    <div class="config-block">
      <label>Courses</label>
      <select id="courses">
        <option value="1">1 Course</option>
        <option value="4" selected>4 Courses (GP)</option>
        <option value="6">6 Courses</option>
        <option value="8">8 Courses</option>
        <option value="12">12 Courses</option>
        <option value="16">16 Courses</option>
        <option value="24">24 Courses</option>
        <option value="32">32 Courses</option>
        <option value="48">48 Courses (All)</option>
      </select>
    </div>

    <div class="config-block full">
      <label>Kart Parts to Randomize</label>
      <div class="toggle-row">
        <button class="toggle-btn active" id="btn-kart"   onclick="togglePart('kart')">Kart Body</button>
        <button class="toggle-btn active" id="btn-wheels" onclick="togglePart('wheels')">Wheels</button>
        <button class="toggle-btn active" id="btn-glider" onclick="togglePart('glider')">Glider</button>
      </div>
    </div>

    <div class="config-block full">
      <label>Items</label>
      <div class="toggle-row">
        <button class="item-mode-btn" onclick="setItemMode('none',this)">None</button>
        <button class="item-mode-btn active" onclick="setItemMode('set',this)">Set Count</button>
        <button class="item-mode-btn" onclick="setItemMode('random',this)">Random Count</button>
      </div>
      <div class="item-count-row" id="itemCountRow">
        <label style="margin-top:12px">Number of items: <span id="ival" style="color:var(--accent2);font-weight:900">3</span></label>
        <input type="range" id="itemCount" min="1" max="22" value="3"
               oninput="document.getElementById('ival').textContent=this.value">
      </div>
    </div>
  </div>

  <div class="roll-wrap">
    <button class="roll-btn" onclick="rollAll()">ROLL EVERYTHING</button>
  </div>

  <div id="results">
    <div class="result-section">
      <div class="result-head">Characters</div>
      <div class="result-body" id="out-chars"></div>
    </div>
    <div class="result-section">
      <div class="result-head">Kart Builds</div>
      <div class="result-body" id="out-karts"></div>
    </div>
    <div class="result-section" id="sec-items" style="display:none">
      <div class="result-head">Items</div>
      <div class="result-body" id="out-items"></div>
    </div>
    <div class="result-section">
      <div class="result-head">Courses</div>
      <div class="result-body" id="out-courses"></div>
    </div>
    <div class="reroll-wrap">
      <button class="reroll-btn" onclick="rollAll()">Roll Again</button>
    </div>
  </div>
</div>

// Helper — returns an <img> tag if the image map has an entry, otherwise empty string
function sprite(map, name, size = 40) {
  if (!map || !map[name]) return '';
  return `<img src="${map[name]}" 
               style="height:${size}px;width:${size}px;object-fit:contain;
                      image-rendering:pixelated;flex-shrink:0"
               alt="${name}"
               onerror="this.style.display='none'">`;
  // onerror hides the broken image icon if the file isn't uploaded yet
}

// ── STATE ──
let itemMode = 'set';
const parts = { kart: true, wheels: true, glider: true };

function togglePart(key) {
  parts[key] = !parts[key];
  document.getElementById(`btn-${key}`).classList.toggle('active', parts[key]);
}
function setItemMode(mode, btn) {
  itemMode = mode;
  document.querySelectorAll('.item-mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('itemCountRow').style.display = mode === 'none' ? 'none' : 'block';
}
function syncRange(id, valId) {
  document.getElementById(valId).textContent = document.getElementById(id).value;
}

// ── UTILS ──
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function sample(arr, n) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, n);
}

// Pick a random character
function randomChar() {
  // Build pool: each simple char is one entry; each variant group is one entry
  const pool = [...CHARS_SIMPLE, ...CHARS_VARIANT];
  const entry = pick(pool);
  return Array.isArray(entry) ? pick(entry) : entry;
}

// Flatten all cups into individual track objects, shuffle, take n
function pickCourses(n) {
  const all = [];
  for (const { cup, tracks } of CUP_DATA) {
    for (const track of tracks) all.push({ cup, track });
  }
  return sample(all, Math.min(n, all.length));
}

// ROLL
function rollAll() {
  const players     = +document.getElementById('players').value;
  const courseCount = +document.getElementById('courses').value;
  const maxItems    = +document.getElementById('itemCount').value;

  // Characters
  const charOut = document.getElementById('out-chars');
  charOut.innerHTML = '';
  for (let i = 0; i < players; i++) {
    const char = randomChar();
    charOut.innerHTML += `
      <div class="result-row">
        <span class="result-num">${i+1}</span>
        ${sprite(IMG.characters, char, 40)}
        <span class="result-label">P${i+1}</span>
        <span class="result-value">${char}</span>
      </div>`;
  }

  // Kart builds
  const kartOut = document.getElementById('out-karts');
  kartOut.innerHTML = '';
  for (let i = 0; i < players; i++) {
    const kart   = parts.kart   ? pick(KARTS)   : '—';
    const wheels = parts.wheels ? pick(WHEELS)  : '—';
    const glider = parts.glider ? pick(GLIDERS) : '—';
    kartOut.innerHTML += `
      <div class="result-row">
        <span class="result-num">${i+1}</span>
        ${sprite(IMG.karts, kart, 40)}
        <span class="result-label">P${i+1}</span>
        <div class="kart-detail">
          <span class="result-value">${kart}</span>
          <div class="kart-parts" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            ${sprite(IMG.wheels, wheels, 28)} ${wheels}
            &bull;
            ${sprite(IMG.gliders, glider, 28)} ${glider}
          </div>
        </div>
      </div>`;
  }

  // Items
  const itemSec = document.getElementById('sec-items');
  const itemOut = document.getElementById('out-items');
  if (itemMode === 'none') {
    itemSec.style.display = 'none';
  } else {
    itemSec.style.display = 'block';
    const count = itemMode === 'random'
      ? (1 + Math.floor(Math.random() * maxItems))
      : maxItems;
    const picked = sample(ITEMS, Math.min(count, ITEMS.length));
    itemOut.innerHTML = picked.map((item, i) => `
      <div class="result-row">
        <span class="result-num">${i+1}</span>
        ${sprite(IMG.items, item, 40)}
        <span class="result-label">Item ${i+1}</span>
        <span class="result-value">${item}</span>
      </div>`).join('');
  }

  // Courses
  const courseOut = document.getElementById('out-courses');
  const pickedCourses = pickCourses(courseCount);
  courseOut.innerHTML = pickedCourses.map(({ cup, track }, i) => `
    <div class="result-row">
      <span class="result-num">${i+1}</span>
      <span class="result-label">Race ${i+1}</span>
      <div class="kart-detail">
        <span class="result-value">${track}</span>
        <span class="course-cup">${cup}</span>
      </div>
    </div>`).join('');

  const res = document.getElementById('results');
  res.style.display = 'block';
  res.classList.add('show');
  res.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
 
//row fx:
// Updated row() for characters and items (single sprite)
function row(label, value, num, imgMap) {
  const img = imgMap ? sprite(imgMap, value) : '';
  return `<div class="result-row">
    <span class="result-num">${num}</span>
    ${img}
    <span class="result-label">${label}</span>
    <span class="result-value">${value}</span>
  </div>`;
}
